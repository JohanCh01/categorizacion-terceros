<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Categorización de Campos Terceros (prueba)</title>
<meta name="theme-color" content="#E30613">
<style>
  :root { --verde: #92D050; --rojo: #FF0000; --azul: #4472C4; --rojo-danper: #E30613; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f2f4f8; margin: 0; padding: 0; color: #1a1a1a;
  }
  header {
    background: var(--rojo-danper); color: white; text-align: center;
    padding: calc(16px + env(safe-area-inset-top)) 20px 16px;
  }
  header h1 { margin: 0; font-size: 1.15rem; }
  .header-fila { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .header-logo { height: 28px; max-width: 90px; object-fit: contain; }
  .contenido { padding: 12px 14px 40px; max-width: 640px; margin: 0 auto; }

  .cat-form { background: white; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .cat-form h3 { margin: 0 0 10px; font-size: 0.95rem; }
  .cat-campo { margin-bottom: 10px; }
  .cat-campo label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 4px; }
  .cat-campo input[type=text], .cat-campo input[type=date], .cat-campo input[type=number] {
    width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem;
  }
  .cat-indicador { border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .cat-indicador-titulo { font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .cat-fila-2 { display: flex; gap: 8px; }
  .cat-fila-2 > div { flex: 1; }
  .cat-campo input:disabled { background: #eee; color: #888; }
  .cat-regla { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 2px; }
  .cat-regla-linea {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: #f7f7f9; border-radius: 6px; padding: 6px 10px; font-size: 0.78rem; color: #555;
  }
  .cat-regla-chip { font-weight: 700; border-radius: 12px; padding: 2px 10px; font-size: 0.75rem; white-space: nowrap; }
  .chip-ok { background: #e6f4ea; color: #2e7d32; }
  .chip-mid { background: #fff3e0; color: #e65100; }
  .chip-cat6 { background: #fdecea; color: #c62828; }
  .cat-tramos-toggle { display: block; font-size: 0.82rem; color: #333; margin: 2px 0 8px; }
  .tramo-fila { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .tramo-fila .cat-campo { flex: 1; margin-bottom: 0; }
  .tramo-fila .btn-quitar-tramo {
    flex: 0 0 auto; background: #fdecea; color: #c62828; border: 1px solid #f5c6c0; border-radius: 8px;
    width: 34px; height: 34px; font-size: 1rem; cursor: pointer;
  }
  .btn-agregar-tramo {
    width: 100%; padding: 8px; background: white; color: var(--azul); border: 1px dashed var(--azul);
    border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 4px;
  }
  .btn-iniciar {
    width: 100%; padding: 14px; background: var(--rojo-danper); color: white; border: none;
    border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px;
  }
  .btn-iniciar:disabled { opacity: 0.6; }
  .fase2-caja { background: white; border-radius: 10px; padding: 14px; margin-top: 14px; text-align: center; }
  .btn-fase2 {
    width: 100%; padding: 14px; background: var(--azul); color: white; border: none;
    border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .fase2-nota { font-size: 0.8rem; color: #777; margin-top: 8px; }
  .fase2-excluir { display: block; font-size: 0.82rem; color: #333; margin-bottom: 10px; text-align: left; }
  .progreso-caja { background: white; border-radius: 10px; padding: 18px 14px; margin-top: 14px; text-align: center; }
  .progreso-spinner {
    width: 32px; height: 32px; margin: 0 auto 10px; border-radius: 50%;
    border: 3px solid #e0e0e0; border-top-color: var(--azul);
    animation: cat-girar 0.8s linear infinite;
  }
  .progreso-spinner.ok {
    border: none; background: #e6f4ea; color: #2e7d32; font-size: 1.1rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center; animation: none;
  }
  @keyframes cat-girar { to { transform: rotate(360deg); } }
  .progreso-parte { font-weight: 700; font-size: 0.9rem; color: #333; margin-bottom: 2px; }
  .progreso-texto { font-size: 0.85rem; color: #555; }
  .resultado-caja { margin-top: 16px; }
  .resultado-imagen-wrap { background: white; border-radius: 10px; padding: 10px; text-align: center; }
  .resultado-imagen-wrap img { max-width: 100%; border-radius: 6px; }
  .resultado-acciones { display: flex; gap: 10px; margin-top: 10px; }
  .resultado-acciones button {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; background: white; font-size: 0.9rem; cursor: pointer;
  }
  .banner-ok { background: rgba(146,208,80,0.18); color: #4c7a1e; border-radius: 10px; padding: 14px; text-align: center; font-weight: 700; margin-top: 14px; }
  .banner-problema { background: rgba(255,0,0,0.08); border-radius: 10px; padding: 14px; margin-top: 14px; }
  .banner-problema-titulo { color: #b30000; font-weight: 800; font-size: 1rem; margin-bottom: 8px; }
  .banner-problema ul { margin: 0; padding-left: 18px; color: #b30000; font-weight: 600; font-size: 0.9rem; }
  .historial-caja { background: white; border-radius: 10px; padding: 14px; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="header-fila">
    <h1>Categorización de Campos Terceros</h1>
    <img src="logo-danper.png" alt="Danper" class="header-logo" onerror="this.style.display='none'">
  </div>
</header>

<div class="contenido">

  <div class="cat-form">
    <h3>Fechas</h3>
    <div class="cat-campo">
      <label>Fecha a filtrar</label>
      <input type="date" id="fecha">
    </div>
    <div class="cat-fila-2">
      <div class="cat-campo"><label>Inicio (tabla final)</label><input type="date" id="fechaInicio"></div>
      <div class="cat-campo"><label>Fin (tabla final)</label><input type="date" id="fechaFin"></div>
    </div>
  </div>

  <div class="cat-form">
    <h3>Indicadores</h3>

    <div class="cat-indicador" data-prefijo="larva">
      <div class="cat-indicador-titulo"><input type="checkbox" id="larvaEnabled" checked> LARVA DE LEPIDÓPTEROS</div>
      <div class="cat-campo" id="larvaUmbralSimpleWrap"><label>Umbral (%)</label><input type="number" id="larvaUmbral" value="10" step="0.1"></div>
      <label class="cat-tramos-toggle"><input type="checkbox" id="larvaTramosEnabled"> Definir tramos personalizados</label>
      <div id="larvaTramosLista" style="display:none"></div>
      <button class="btn-agregar-tramo" id="larvaAgregarTramo" type="button" style="display:none">+ Agregar tramo</button>
      <div class="cat-regla" id="larvaRegla"></div>
    </div>

    <div class="cat-indicador" data-prefijo="posturas">
      <div class="cat-indicador-titulo"><input type="checkbox" id="posturasEnabled" checked> POSTURAS</div>
      <div class="cat-campo" id="posturasUmbralSimpleWrap"><label>Umbral (%)</label><input type="number" id="posturasUmbral" value="2" step="0.1"></div>
      <label class="cat-tramos-toggle"><input type="checkbox" id="posturasTramosEnabled"> Definir tramos personalizados</label>
      <div id="posturasTramosLista" style="display:none"></div>
      <button class="btn-agregar-tramo" id="posturasAgregarTramo" type="button" style="display:none">+ Agregar tramo</button>
      <div class="cat-regla" id="posturasRegla"></div>
    </div>

    <div class="cat-indicador" data-prefijo="picados">
      <div class="cat-indicador-titulo"><input type="checkbox" id="picadosEnabled" checked> PICADOS ELASMOSPALPUS</div>
      <div class="cat-campo" id="picadosUmbralSimpleWrap"><label>Umbral (%)</label><input type="number" id="picadosUmbral" value="10" step="0.1"></div>
      <label class="cat-tramos-toggle"><input type="checkbox" id="picadosTramosEnabled"> Definir tramos personalizados</label>
      <div id="picadosTramosLista" style="display:none"></div>
      <button class="btn-agregar-tramo" id="picadosAgregarTramo" type="button" style="display:none">+ Agregar tramo</button>
      <div class="cat-regla" id="picadosRegla"></div>
    </div>
  </div>

  <button class="btn-iniciar" id="btnIniciar">Iniciar</button>

  <div class="progreso-caja" id="progresoCaja" style="display:none">
    <div class="progreso-spinner" id="progresoSpinner"></div>
    <div class="progreso-parte" id="progresoParte">Parte 1/3</div>
    <div class="progreso-texto" id="progresoTexto">Iniciando...</div>
  </div>

  <div class="resultado-caja" id="resultadoCaja" style="display:none">
    <div class="resultado-imagen-wrap">
      <img id="resultadoImagen" src="" alt="Categorización">
    </div>
    <div class="resultado-acciones">
      <button id="btnDescargar">&#11015;&#65039; Descargar</button>
      <button id="btnCompartir">&#128228; Compartir</button>
    </div>
    <div id="bannerEstado"></div>
  </div>

  <div class="fase2-caja" id="fase2Caja" style="display:none">
    <label class="fase2-excluir">
      <input type="checkbox" id="fase2ExcluirObservados" checked>
      Excluir proveedores observados (SIN CATEGORÍA / SIN REGISTRO)
    </label>
    <button class="btn-fase2" id="btnFase2">Iniciar Fase 2</button>
    <div class="fase2-nota">Categorización de las unidades agrícolas propias (por implementar).</div>
  </div>

  <div class="historial-caja">
    <h3>Historial (últimos 7 días)</h3>
    <input type="date" id="inputHistorial">
    <div class="resultado-caja" id="historialResultado" style="display:none">
      <div class="resultado-imagen-wrap">
        <img id="historialImagen" src="" alt="Historial">
      </div>
      <div id="historialBanner"></div>
    </div>
  </div>

</div>

<script>
(function() {
  // El token de GitHub ya NO vive en esta página (GitHub bloquea siempre
  // cualquier archivo público con un token real, codificado o no). En su
  // lugar, esta página le pide a un Worker de Cloudflare (que sí tiene el
  // token, guardado ahí de forma segura) que dispare el workflow por
  // nosotros.
  const URL_WORKER = "https://categorizacion-disparo.johanchinguel07.workers.dev";
  const DIAS_HISTORIAL = 7;

  function fmtISO(d) {
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return `${d.getFullYear()}-${mm}-${dd}`;
  }
  function isoToDDMM(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  const hoyCat = new Date();
  const ayerCat = new Date(hoyCat); ayerCat.setDate(hoyCat.getDate() - 1);
  document.getElementById('fecha').value = fmtISO(ayerCat);
  document.getElementById('fechaInicio').value = fmtISO(hoyCat);
  document.getElementById('fechaFin').value = fmtISO(hoyCat);

  // El historial solo se conserva publicado por 7 días (de hoy hacia
  // atrás) -- lo más viejo ya queda consolidado en el Excel, así que el
  // selector de fecha del historial no deja elegir fuera de ese rango.
  const haceUnaSemanaCat = new Date(hoyCat); haceUnaSemanaCat.setDate(hoyCat.getDate() - (DIAS_HISTORIAL - 1));
  const inputHistorial = document.getElementById('inputHistorial');
  inputHistorial.min = fmtISO(haceUnaSemanaCat);
  inputHistorial.max = fmtISO(hoyCat);

  // Tramos personalizados por indicador: cada indicador puede evaluarse
  // con un Umbral simple (todo lo que lo supere -> CAT 6), o con una
  // lista de tramos (el primero siempre "sin desviación", los
  // siguientes cada uno con su propia categoría), terminando siempre en
  // CAT 6 para lo que no cae en ningún tramo definido. Esto refleja
  // exactamente lo que hace _evaluar_indicador() en procesamiento.py.
  const tramosState = {};

  function tramosPorDefecto(prefijo) {
    const umbral = parseFloat(document.getElementById(prefijo + 'Umbral').value) || 0;
    return [
      { hasta: umbral, categoria: null },
      { hasta: umbral + 2, categoria: 2 },
    ];
  }

  function renderRegla(prefijo, tramosEnabled) {
    const cont = document.getElementById(prefijo + 'Regla');
    let html = '';
    let desde = 0;
    if (tramosEnabled) {
      (tramosState[prefijo] || []).forEach((t) => {
        if (t.categoria === null) {
          html += `<div class="cat-regla-linea"><span>Hasta ${t.hasta}%</span><span class="cat-regla-chip chip-ok">Sin desviación</span></div>`;
        } else {
          html += `<div class="cat-regla-linea"><span>De ${desde}% a ${t.hasta}%</span><span class="cat-regla-chip chip-mid">CAT ${t.categoria}</span></div>`;
        }
        desde = t.hasta;
      });
    } else {
      const umbral = document.getElementById(prefijo + 'Umbral').value || '0';
      html += `<div class="cat-regla-linea"><span>Hasta ${umbral}%</span><span class="cat-regla-chip chip-ok">Sin desviación</span></div>`;
      desde = umbral;
    }
    html += `<div class="cat-regla-linea"><span>Más de ${desde}%</span><span class="cat-regla-chip chip-cat6">CAT 6</span></div>`;
    cont.innerHTML = html;
  }

  function renderTramos(prefijo) {
    const lista = document.getElementById(prefijo + 'TramosLista');
    lista.innerHTML = '';
    (tramosState[prefijo] || []).forEach((t, i) => {
      const fila = document.createElement('div');
      fila.className = 'tramo-fila';

      const campoHasta = document.createElement('div');
      campoHasta.className = 'cat-campo';
      campoHasta.innerHTML = `<label>${i === 0 ? 'Sin desviación hasta (%)' : 'Hasta (%)'}</label>
        <input type="number" step="0.1" value="${t.hasta}">`;
      campoHasta.querySelector('input').addEventListener('input', (e) => {
        tramosState[prefijo][i].hasta = parseFloat(e.target.value) || 0;
        renderRegla(prefijo, true);
      });
      fila.appendChild(campoHasta);

      if (i > 0) {
        const campoCat = document.createElement('div');
        campoCat.className = 'cat-campo';
        campoCat.innerHTML = `<label>Categoría</label><input type="number" value="${t.categoria}">`;
        campoCat.querySelector('input').addEventListener('input', (e) => {
          tramosState[prefijo][i].categoria = parseInt(e.target.value, 10) || 0;
          renderRegla(prefijo, true);
        });
        fila.appendChild(campoCat);

        if (i > 1) {
          const btnQuitar = document.createElement('button');
          btnQuitar.type = 'button';
          btnQuitar.className = 'btn-quitar-tramo';
          btnQuitar.textContent = '✕';
          btnQuitar.addEventListener('click', () => {
            tramosState[prefijo].splice(i, 1);
            renderTramos(prefijo);
            renderRegla(prefijo, true);
          });
          fila.appendChild(btnQuitar);
        }
      }
      lista.appendChild(fila);
    });
  }

  function wireIndicador(prefijo) {
    const toggle = document.getElementById(prefijo + 'TramosEnabled');
    const simpleWrap = document.getElementById(prefijo + 'UmbralSimpleWrap');
    const lista = document.getElementById(prefijo + 'TramosLista');
    const btnAgregar = document.getElementById(prefijo + 'AgregarTramo');
    const umbral = document.getElementById(prefijo + 'Umbral');

    function actualizar() {
      const on = toggle.checked;
      simpleWrap.style.display = on ? 'none' : 'block';
      lista.style.display = on ? 'block' : 'none';
      btnAgregar.style.display = on ? 'block' : 'none';
      if (on && !tramosState[prefijo]) {
        tramosState[prefijo] = tramosPorDefecto(prefijo);
      }
      if (on) renderTramos(prefijo);
      renderRegla(prefijo, on);
    }

    toggle.addEventListener('change', actualizar);
    umbral.addEventListener('input', () => renderRegla(prefijo, toggle.checked));
    btnAgregar.addEventListener('click', () => {
      const ultimo = tramosState[prefijo][tramosState[prefijo].length - 1];
      tramosState[prefijo].push({ hasta: ultimo.hasta + 1, categoria: 4 });
      renderTramos(prefijo);
      renderRegla(prefijo, true);
    });
    actualizar();
  }
  ['larva', 'posturas', 'picados'].forEach(wireIndicador);

  function indicador(prefijo) {
    const enabled = document.getElementById(prefijo + 'Enabled').checked;
    if (!enabled) return { enabled: false };
    const tramosEnabled = document.getElementById(prefijo + 'TramosEnabled').checked;
    let tramos;
    if (tramosEnabled) {
      tramos = (tramosState[prefijo] || []).map((t) => (
        t.categoria === null ? { hasta: t.hasta / 100 } : { hasta: t.hasta / 100, categoria: t.categoria }
      ));
    } else {
      const umbral = parseFloat(umbralEl(prefijo).value) / 100;
      tramos = [{ hasta: umbral }];
    }
    return { enabled: true, tramos: tramos };
  }
  function umbralEl(prefijo) { return document.getElementById(prefijo + 'Umbral'); }

  function armarConfig() {
    return {
      fecha: isoToDDMM(document.getElementById('fecha').value),
      fecha_inicio: isoToDDMM(document.getElementById('fechaInicio').value),
      fecha_fin: isoToDDMM(document.getElementById('fechaFin').value),
      indicadores: {
        LARVA: indicador('larva'),
        SUMA_POSTURAS: indicador('posturas'),
        SUMA_PICADOS: indicador('picados'),
      },
    };
  }

  const btnIniciar = document.getElementById('btnIniciar');
  const progresoCaja = document.getElementById('progresoCaja');
  const progresoSpinner = document.getElementById('progresoSpinner');
  const progresoParte = document.getElementById('progresoParte');
  const progresoTexto = document.getElementById('progresoTexto');
  const resultadoCaja = document.getElementById('resultadoCaja');
  const LS_KEY = 'categorizacion_dispatch_ts';
  let intervaloSondeo = null;

  // Son 3 "partes" visibles para el usuario, aunque el backend reporte
  // pasos más finos (1=descarga, 2-3=entrar a la intranet, 4-6=procesar
  // y publicar): Parte 1 = descarga de FOSFINA, Parte 2 = intranet
  // (Recepción + Categorización), Parte 3 = guardar/generar/publicar.
  function pasoAParte(paso) {
    const p = Math.floor(paso || 1);
    if (p <= 1) return 1;
    if (p <= 3) return 2;
    return 3;
  }

  btnIniciar.addEventListener('click', async () => {
    btnIniciar.disabled = true;
    resultadoCaja.style.display = 'none';
    progresoSpinner.className = 'progreso-spinner';
    progresoSpinner.textContent = '';
    progresoParte.textContent = 'Parte 1/3';
    progresoCaja.style.display = 'block';
    progresoTexto.textContent = 'Enviando orden de inicio...';

    const cfg = armarConfig();
    try {
      const resp = await fetch(URL_WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ config: cfg }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        throw new Error(data.error || `El intermediario respondió ${resp.status}`);
      }
      localStorage.setItem(LS_KEY, Date.now().toString());
      progresoTexto.textContent = 'Iniciado. Puedes minimizar o cerrar esta página, el proceso sigue igual.';
      empezarSondeo();
    } catch (e) {
      progresoTexto.textContent = 'Error al iniciar: ' + e.message;
      btnIniciar.disabled = false;
    }
  });

  function empezarSondeo() {
    if (intervaloSondeo) clearInterval(intervaloSondeo);
    consultarEstado();
    intervaloSondeo = setInterval(consultarEstado, 5000);
  }

  async function consultarEstado() {
    try {
      const resp = await fetch('categorizacion/status.json?_=' + Date.now());
      if (!resp.ok) return;
      const estado = await resp.json();

      const tsDisparo = parseInt(localStorage.getItem(LS_KEY) || '0', 10);
      const tsEstado = new Date(estado.actualizado).getTime();
      if (tsDisparo && tsEstado < tsDisparo - 5000) return;

      progresoCaja.style.display = 'block';
      progresoParte.textContent = `Parte ${pasoAParte(estado.paso)}/3`;
      progresoTexto.textContent = estado.mensaje || '...';

      if (estado.done) {
        clearInterval(intervaloSondeo);
        btnIniciar.disabled = false;
        if (estado.error) {
          progresoTexto.textContent = 'Error: ' + estado.error;
        } else {
          progresoSpinner.className = 'progreso-spinner ok';
          progresoSpinner.textContent = '✓';
          progresoTexto.textContent = 'Listo.';
          setTimeout(() => {
            progresoCaja.style.display = 'none';
            mostrarResultado();
          }, 900);
        }
      }
    } catch (e) {}
  }

  if (localStorage.getItem(LS_KEY)) empezarSondeo();

  async function mostrarResultado() {
    try {
      const resp = await fetch('categorizacion/ultima.json?_=' + Date.now());
      if (!resp.ok) return;
      renderResultado(await resp.json());
    } catch (e) {}
  }

  function renderResultado(data) {
    resultadoCaja.style.display = 'block';
    document.getElementById('fase2Caja').style.display = 'block';
    const img = document.getElementById('resultadoImagen');
    const banner = document.getElementById('bannerEstado');
    const wrap = img.closest('.resultado-imagen-wrap');
    const acciones = document.querySelector('.resultado-acciones');

    if (data.sin_desviaciones) {
      wrap.style.display = 'none';
      acciones.style.display = 'none';
      banner.innerHTML = `<div class="banner-ok">&#9989; No hubo desviaciones para el ${data.fecha_objetivo}.</div>`;
      return;
    }
    wrap.style.display = 'block';
    acciones.style.display = 'flex';
    img.src = 'categorizacion/ultima.png?_=' + Date.now();

    if (data.todo_ok) {
      banner.innerHTML = `<div class="banner-ok">&#9989; Todo categorizado correctamente (${data.fecha_objetivo}).</div>`;
    } else {
      const items = data.problemas.map(p =>
        `<li>${p.unidad_agricola || '(sin unidad)'} — Módulo ${p.modulo || '-'} — Campo ${p.campo} (${p.status})</li>`
      ).join('');
      banner.innerHTML = `
        <div class="banner-problema">
          <div class="banner-problema-titulo">&#9888;&#65039; ${data.problemas.length} campo(s) sin categorizar</div>
          <ul>${items}</ul>
        </div>`;
    }
  }

  document.getElementById('btnDescargar').addEventListener('click', async () => {
    const resp = await fetch('categorizacion/ultima.png');
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'categorizacion.png';
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btnCompartir').addEventListener('click', async () => {
    try {
      const resp = await fetch('categorizacion/ultima.png');
      const blob = await resp.blob();
      const archivo = new File([blob], 'categorizacion.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        await navigator.share({ files: [archivo], title: 'Categorización de Campos Terceros' });
      } else {
        alert('Tu navegador no soporta compartir imágenes directamente; usa el botón de descargar.');
      }
    } catch (e) {}
  });

  // Fase 2 (categorización de unidades agrícolas propias) todavía no
  // está implementada -- este botón por ahora solo deja el lugar listo
  // en la página para cuando se arme esa parte.
  document.getElementById('btnFase2').addEventListener('click', () => {
    alert('Fase 2 (categorización de unidades agrícolas propias) aún no está implementada. Próximamente aquí se podrá iniciar ese proceso.');
  });

  inputHistorial.addEventListener('change', async () => {
    const iso = inputHistorial.value;
    if (!iso) return;
    const cont = document.getElementById('historialResultado');
    const wrap = document.querySelector('#historialResultado .resultado-imagen-wrap');
    const banner = document.getElementById('historialBanner');
    cont.style.display = 'block';
    wrap.style.display = 'none';
    banner.innerHTML = 'Cargando...';
    try {
      const resp = await fetch(`categorizacion/historial/${iso}.json?_=` + Date.now());
      if (!resp.ok) {
        banner.innerHTML = `No hay registro guardado para ${isoToDDMM(iso)}.`;
        return;
      }
      renderHistorial(await resp.json(), iso);
    } catch (e) {
      banner.innerHTML = 'No se pudo cargar el historial.';
    }
  });

  function renderHistorial(data, iso) {
    const img = document.getElementById('historialImagen');
    const wrap = img.closest('.resultado-imagen-wrap');
    const banner = document.getElementById('historialBanner');

    if (data.sin_desviaciones) {
      wrap.style.display = 'none';
      banner.innerHTML = `<div class="banner-ok">&#9989; No hubo desviaciones para el ${data.fecha_objetivo}.</div>`;
      return;
    }
    wrap.style.display = 'block';
    img.src = `categorizacion/historial/${iso}.png?_=` + Date.now();

    if (data.todo_ok) {
      banner.innerHTML = `<div class="banner-ok">&#9989; Todo categorizado correctamente (${data.fecha_objetivo}).</div>`;
    } else {
      const items = data.problemas.map(p =>
        `<li>${p.unidad_agricola || '(sin unidad)'} — Módulo ${p.modulo || '-'} — Campo ${p.campo} (${p.status})</li>`
      ).join('');
      banner.innerHTML = `
        <div class="banner-problema">
          <div class="banner-problema-titulo">&#9888;&#65039; ${data.problemas.length} campo(s) sin categorizar</div>
          <ul>${items}</ul>
        </div>`;
    }
  }
})();
</script>

</body>
</html>
